<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPortal - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f1ff, #e8f1ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(60, 40, 130, 0.12);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      background: #6854e8;
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      color: #4935bc;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6854e8;
      box-shadow: 0 0 0 3px rgba(104, 84, 232, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #6854e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #eeeaff;
      color: #4935bc;
    }

    .links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .links button {
      width: auto;
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #6854e8;
      font-size: 14px;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      text-decoration: none;
      color: #777;
      font-size: 14px;
    }

    .language {
      position: absolute;
      top: 15px;
      right: 15px;
      width: auto;
      padding: 9px 14px;
      margin: 0;
      border-radius: 20px;
      background: white;
      color: #4935bc;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <button class="language" id="languageBtn">தமிழ்</button>

  <main class="login-card">
    <div class="logo">📚</div>

    <h1>EduPortal</h1>

    <p class="subtitle" id="subtitle">
      Sign in to your learning portal
    </p>

    <form id="loginForm">
      <label for="email" id="emailLabel">Email address</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="Enter your email"
        required
      >

      <label for="password" id="passwordLabel">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginBtn">Login</button>
    </form>

    <div class="links">
      <button type="button" id="forgotBtn">Forgot password?</button>
    </div>

    <p id="message" role="status"></p>

    <a href="index.html" class="back" id="backLink">
      ← Back to Home
    </a>
  </main>

  <script type="module">
    import { loginUser, resetPassword } from "./auth.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const message = document.getElementById("message");
    const languageBtn = document.getElementById("languageBtn");

    let language = "en";

    const translations = {
      en: {
        subtitle: "Sign in to your learning portal",
        emailLabel: "Email address",
        emailPlaceholder: "Enter your email",
        passwordLabel: "Password",
        passwordPlaceholder: "Enter your password",
        login: "Login",
        forgot: "Forgot password?",
        back: "← Back to Home",
        loggingIn: "Signing in...",
        resetSent: "Password reset email sent. Check your inbox.",
        enterEmail: "Please enter your email address first.",
        loginSuccess: "Login successful. Authentication is working!",
        errors: {
          "auth/invalid-credential": "Incorrect email or password.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/user-disabled": "This account has been disabled.",
          "auth/too-many-requests": "Too many attempts. Try again later.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "auth/user-not-found": "Account not found.",
          "auth/wrong-password": "Incorrect password."
        }
      },
      ta: {
        subtitle: "உங்கள் கல்வி தளத்தில் உள்நுழையவும்",
        emailLabel: "மின்னஞ்சல் முகவரி",
        emailPlaceholder: "மின்னஞ்சலை உள்ளிடவும்",
        passwordLabel: "கடவுச்சொல்",
        passwordPlaceholder: "கடவுச்சொல்லை உள்ளிடவும்",
        login: "உள்நுழை",
        forgot: "கடவுச்சொல் மறந்துவிட்டதா?",
        back: "← முகப்புக்குத் திரும்பு",
        loggingIn: "உள்நுழைகிறது...",
        resetSent: "கடவுச்சொல் மீட்டமைப்பு மின்னஞ்சல் அனுப்பப்பட்டது.",
        enterEmail: "முதலில் உங்கள் மின்னஞ்சல் முகவரியை உள்ளிடவும்.",
        loginSuccess: "உள்நுழைவு வெற்றி! அங்கீகாரம் செயல்படுகிறது.",
        errors: {
          "auth/invalid-credential": "மின்னஞ்சல் அல்லது கடவுச்சொல் தவறானது.",
          "auth/invalid-email": "சரியான மின்னஞ்சலை உள்ளிடவும்.",
          "auth/user-disabled": "இந்த கணக்கு முடக்கப்பட்டுள்ளது.",
          "auth/too-many-requests": "பல முயற்சிகள். பின்னர் முயற்சிக்கவும்.",
          "auth/network-request-failed": "இணைய இணைப்பை சரிபார்க்கவும்.",
          "auth/user-not-found": "கணக்கு காணப்படவில்லை.",
          "auth/wrong-password": "கடவுச்சொல் தவறானது."
        }
      }
    };

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#16803c" : "#d93025";
    }

    function applyLanguage() {
      const t = translations[language];

      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("emailLabel").textContent = t.emailLabel;
      emailInput.placeholder = t.emailPlaceholder;
      document.getElementById("passwordLabel").textContent = t.passwordLabel;
      passwordInput.placeholder = t.passwordPlaceholder;
      loginBtn.textContent = t.login;
      forgotBtn.textContent = t.forgot;
      document.getElementById("backLink").textContent = t.back;
      languageBtn.textContent = language === "en" ? "தமிழ்" : "English";

      document.documentElement.lang = language;
      message.textContent = "";
    }

    languageBtn.addEventListener("click", () => {
      language = language === "en" ? "ta" : "en";
      applyLanguage();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginBtn.disabled = true;
      loginBtn.textContent = translations[language].loggingIn;
      showMessage("");

      try {
        await loginUser(email, password);
        showMessage(translations[language].loginSuccess, true);
      } catch (error) {
        const t = translations[language];
        showMessage(
          t.errors[error.code] || "Login failed. Please try again."
        );
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = translations[language].login;
      }
    });

    forgotBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        showMessage(translations[language].enterEmail);
        emailInput.focus();
        return;
      }

      try {
        await resetPassword(email);
        showMessage(translations[language].resetSent, true);
      } catch (error) {
        showMessage("Unable to send reset email. Please check the email address.");
      }
    });

    applyLanguage();
  </script>

</body>
</html>
