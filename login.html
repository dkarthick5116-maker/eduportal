<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPortal - Login & Registration</title>

  <!-- PWA & App Icons -->
  <link rel="icon" type="image/png" href="file_0000000018c8820bbb5ed8b1c124a4c3.png" />
  <link rel="apple-touch-icon" href="file_0000000018c8820bbb5ed8b1c124a4c3.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #f7f5ff;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-navbar {
      background: #1e1b4b;
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .lang-group {
      display: flex;
      gap: 6px;
    }

    .lang-pill {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .lang-pill.active {
      background: #ffffff;
      color: #1e1b4b;
      font-weight: 700;
      border-color: #ffffff;
    }
        .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .portal-switch-card {
      background: #ede9fe;
      border-radius: 12px;
      padding: 4px;
      display: flex;
      width: 100%;
      max-width: 380px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .portal-tab {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      color: #4338ca;
      border: none;
      background: transparent;
      transition: all 0.2s ease;
    }

    .portal-tab.active {
      background: #ffffff;
      color: #1e1b4b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .status-banner {
      width: 100%;
      max-width: 380px;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      box-sizing: border-box;
      display: none;
    }

    .status-banner.success {
      display: block;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
    }

    .status-banner.error {
      display: block;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .form-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
    }

    .form-title {
      text-align: center;
      color: #1e1b4b;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px 0;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .field-group input, .field-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      background: #fdfdfd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .field-group input:focus, .field-group select:focus {
      border-color: #4338ca;
      background: #fff;
    }

    .flex-row-fields {
      display: flex;
      gap: 10px;
    }

    .flex-row-fields .field-group {
      flex: 1;
    }

    .submit-button {
      width: 100%;
      background: #1e1b4b;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .submit-button:hover {
      background: #312e81;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-actions {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .footer-actions a {
      color: #4338ca;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="top-navbar">
    <div class="brand-container">
      <img src="file_0000000018c8820bbb5ed8b1c124a4c3.png" alt="EduPortal Logo" class="brand-logo" />
      <span class="brand-title">EduPortal</span>
    </div>
    <div class="lang-group">
      <button class="lang-pill active" id="btn-lang-en">English</button>
      <button class="lang-pill" id="btn-lang-ta">தமிழ்</button>
    </div>
  </div>

  <div class="content-area">
    <div class="portal-switch-card">
      <button type="button" class="portal-tab active" id="tab-student">Student Portal</button>
      <button type="button" class="portal-tab" id="tab-teacher">Teacher Portal</button>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <div class="form-card">
      <h2 class="form-title" id="form-heading">Student Login</h2>

      <form id="portal-form">
        <!-- Student Name (Register only) -->
        <div class="field-group hidden" id="grp-student-name">
          <label id="lbl-student-name" for="student-name">Full Name</label>
          <input type="text" id="student-name" placeholder="Enter student name" />
        </div>

        <!-- Teacher Name (Register only) -->
        <div class="field-group hidden" id="grp-teacher-name">
          <label id="lbl-teacher-name" for="teacher-name">Full Name</label>
          <input type="text" id="teacher-name" placeholder="Enter teacher name" />
        </div>

        <!-- School Name -->
        <div class="field-group" id="grp-school">
          <label id="lbl-school" for="school-name">School Name</label>
          <input type="text" id="school-name" placeholder="e.g. GHSS Chennai" required />
        </div>

        <!-- Curriculum / Board Selection (Registration only) -->
        <div class="field-group hidden" id="grp-curriculum">
          <label id="lbl-curriculum" for="board-select">Curriculum / Board</label>
          <select id="board-select">
            <option value="State Board">Tamil Nadu State Board (Samacheer Kalvi)</option>
            <option value="CBSE">CBSE (Central Board)</option>
          </select>
        </div>

        <!-- Class & Section (Student Register only) -->
        <div class="flex-row-fields hidden" id="grp-class-sec">
          <div class="field-group">
            <label id="lbl-class" for="student-class">Class</label>
            <input type="text" id="student-class" placeholder="e.g. 6" />
          </div>
          <div class="field-group">
            <label id="lbl-sec" for="student-sec">Section</label>
            <input type="text" id="student-sec" placeholder="e.g. A" />
          </div>
        </div>

        <!-- Roll Number (Student only) -->
        <div class="field-group" id="grp-roll">
          <label id="lbl-roll" for="student-roll">Roll Number</label>
          <input type="text" id="student-roll" placeholder="Enter roll number" required />
        </div>

        <!-- Email Address (Teacher only) -->
        <div class="field-group hidden" id="grp-teacher-email">
          <label id="lbl-teacher-email" for="teacher-email">Email Address</label>
          <input type="email" id="teacher-email" placeholder="Enter teacher email" />
        </div>

        <!-- Password -->
        <div class="field-group" id="grp-pass">
          <label id="lbl-pass" for="account-password">Password</label>
          <input type="password" id="account-password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="submit-button" id="btn-submit">Login</button>
      </form>

      <div class="footer-actions">
        <a id="btn-forgot" href="javascript:void(0)">Forgot Password?</a>
        <a id="btn-toggle-mode" href="javascript:void(0)">New student? Register here</a>
        <a href="index.html" id="link-home">&larr; Back to Home</a>
      </div>
    </div>
  </div>
    <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      doc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let activePortal = "student";
    let isRegisterMode = false;
    let currentLang = "en";

    const translations = {
      en: {

        studentNamePlaceholder: "Enter student name",
        teacherNamePlaceholder: "Enter teacher name",

        secLabel: "Section",
        secPlaceholder: "e.g. A",
        password: "Password",
        passPlaceholder: "Enter password",
        loginBtn: "Login",
        registerBtn: "Create Account",
        forgotPass: "Forgot Password?",
        toStudentReg: "New student? Register here",
        toStudentLog: "Already registered? Student Login",
        toTeacherReg: "New teacher? Register here",
        toTeacherLog: "Already registered? Teacher Login",

        passTooShort: "Password must be at least 6 characters.",
        fillAllFields: "Please fill in all required fields.",
        redirectingStudent: "Welcome student! Redirecting...",
        redirectingTeacher: "Welcome teacher! Redirecting...",
        resetSent: "Password reset link sent to your email."
      },
      ta: {
        studentPortalTab: "மாணவர் தளம்",
        teacherPortalTab: "ஆசிரியர் தளம்",
        studentLogin: "மாணவர் உள்நுழைவு",
        studentRegister: "மாணவர் பதிவு",
        teacherLogin: "ஆசிரியர் உள்நுழைவு",
        teacherRegister: "ஆசிரியர் பதிவு",
        schoolName: "பள்ளியின் பெயர்",
        schoolPlaceholder: "எ.கா. அரசு மேல்நிலைப் பள்ளி",
        curriculumLabel: "பாடத்திட்டம் / வாரியம்",
        rollNumber: "பதிவு எண் (Roll No)",
        rollPlaceholder: "பதிவு எண்ணை உள்ளிடவும்",
        teacherEmail: "மின்னஞ்சல் முகவரி",
        emailPlaceholder: "ஆசிரியர் மின்னஞ்சலை உள்ளிடவும்",
        fullName: "முழு பெயர்",
        studentNamePlaceholder: "மாணவர் பெயரை உள்ளிடவும்",
        teacherNamePlaceholder: "ஆசிரியர் பெயரை உள்ளிடவும்",
        classLabel: "வகுப்பு",
        classPlaceholder: "எ.கா. 6",
        secLabel: "பிரிவு",
        secPlaceholder: "எ.கா. A",
        password: "கடவுச்சொல்",
        passPlaceholder: "கடவுச்சொல்லை உள்ளிடவும்",
        loginBtn: "உள்நுழை",
        registerBtn: "கணக்கு உருவாக்கு",
        forgotPass: "கடவுச்சொல் மறந்துவிட்டதா?",
        toStudentReg: "புதிய மாணவரா? பதிவு செய்க",
        toStudentLog: "ஏற்கனவே கணக்கு உள்ளதா? உள்நுழை",
        toTeacherReg: "புதிய ஆசிரியரா? பதிவு செய்க",
        toTeacherLog: "ஏற்கனவே கணக்கு உள்ளதா? உள்நுழை",
        backHome: "← முகப்பு பக்கத்திற்கு",
        passTooShort: "கடவுச்சொல் குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.",
        fillAllFields: "அனைத்து விவரங்களையும் பூர்த்தி செய்யவும்.",
        redirectingStudent: "வரவேற்கிறோம்! மாணவர் பக்கத்திற்கு செல்கிறது...",
        redirectingTeacher: "வரவேற்கிறோம்! ஆசிரியர் பக்கத்திற்கு செல்கிறது...",
        resetSent: "கடவுச்சொல் மீட்டமைப்பு மின்னஞ்சல் அனுப்பப்பட்டது."
      }
    };

    const tabStudent = document.getElementById("tab-student");
    const tabTeacher = document.getElementById("tab-teacher");
    const formHeading = document.getElementById("form-heading");
    const statusBanner = document.getElementById("status-banner");
    const portalForm = document.getElementById("portal-form");
    const btnSubmit = document.getElementById("btn-submit");
    const btnForgot = document.getElementById("btn-forgot");
    const btnToggleMode = document.getElementById("btn-toggle-mode");
    const btnLangEn = document.getElementById("btn-lang-en");
    const btnLangTa = document.getElementById("btn-lang-ta");
    const linkHome = document.getElementById("link-home");

    const grpStudentName = document.getElementById("grp-student-name");
    const grpTeacherName = document.getElementById("grp-teacher-name");
    const grpSchool = document.getElementById("grp-school");
    const grpCurriculum = document.getElementById("grp-curriculum");
    const grpClassSec = document.getElementById("grp-class-sec");
    const grpRoll = document.getElementById("grp-roll");
    const grpTeacherEmail = document.getElementById("grp-teacher-email");

    const lblStudentName = document.getElementById("lbl-student-name");
    const lblTeacherName = document.getElementById("lbl-teacher-name");
    const lblSchool = document.getElementById("lbl-school");
    const lblCurriculum = document.getElementById("lbl-curriculum");
    const lblClass = document.getElementById("lbl-class");
    const lblSec = document.getElementById("lbl-sec");
    const lblRoll = document.getElementById("lbl-roll");
    const lblTeacherEmail = document.getElementById("lbl-teacher-email");
    const lblPass = document.getElementById("lbl-pass");

    const inputStudentName = document.getElementById("student-name");
    const inputTeacherName = document.getElementById("teacher-name");
    const inputSchool = document.getElementById("school-name");
    const selectBoard = document.getElementById("board-select");
    const inputClass = document.getElementById("student-class");
    const inputSec = document.getElementById("student-sec");
    const inputRoll = document.getElementById("student-roll");
    const inputTeacherEmail = document.getElementById("teacher-email");
    const inputPassword = document.getElementById("account-password");
       function cleanString(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function getStudentEmail(school, roll) {
      const cleanSchool = cleanString(school) || "school";
      const cleanRoll = cleanString(roll) || "student";
      return `${cleanRoll}@${cleanSchool}.eduportal`;
    }

    function showStatus(text, type) {
      statusBanner.textContent = text;
      statusBanner.className = `status-banner ${type}`;
    }

    function clearStatus() {
      statusBanner.textContent = "";
      statusBanner.className = "status-banner";
    }

    function updateView() {
      clearStatus();
      const t = translations[currentLang];

      tabStudent.textContent = t.studentPortalTab;
      tabTeacher.textContent = t.teacherPortalTab;
      lblSchool.textContent = t.schoolName;
      inputSchool.placeholder = t.schoolPlaceholder;
      lblCurriculum.textContent = t.curriculumLabel;
      lblPass.textContent = t.password;
      inputPassword.placeholder = t.passPlaceholder;
      btnForgot.textContent = t.forgotPass;
      linkHome.textContent = t.backHome;

      if (activePortal === "student") {
        tabStudent.classList.add("active");
        tabTeacher.classList.remove("active");

        grpTeacherEmail.classList.add("hidden");
        inputTeacherEmail.removeAttribute("required");

        grpTeacherName.classList.add("hidden");
        inputTeacherName.removeAttribute("required");

        grpSchool.classList.remove("hidden");
        inputSchool.setAttribute("required", "required");

        grpRoll.classList.remove("hidden");
        inputRoll.setAttribute("required", "required");
        lblRoll.textContent = t.rollNumber;
        inputRoll.placeholder = t.rollPlaceholder;

        if (isRegisterMode) {
          formHeading.textContent = t.studentRegister;
          grpStudentName.classList.remove("hidden");
          lblStudentName.textContent = t.fullName;
          inputStudentName.placeholder = t.studentNamePlaceholder;

          grpCurriculum.classList.remove("hidden");
          grpClassSec.classList.remove("hidden");
          lblClass.textContent = t.classLabel;
          inputClass.placeholder = t.classPlaceholder;
          lblSec.textContent = t.secLabel;
          inputSec.placeholder = t.secPlaceholder;

          btnSubmit.textContent = t.registerBtn;
          btnToggleMode.textContent = t.toStudentLog;
          btnForgot.classList.add("hidden");
        } else {
          formHeading.textContent = t.studentLogin;
          grpStudentName.classList.add("hidden");
          grpCurriculum.classList.add("hidden");
          grpClassSec.classList.add("hidden");

          btnSubmit.textContent = t.loginBtn;
          btnToggleMode.textContent = t.toStudentReg;
          btnForgot.classList.remove("hidden");
        }
      } else {
        tabTeacher.classList.add("active");
        tabStudent.classList.remove("active");

        grpRoll.classList.add("hidden");
        inputRoll.removeAttribute("required");

        grpStudentName.classList.add("hidden");
        grpClassSec.classList.add("hidden");

        grpTeacherEmail.classList.remove("hidden");
        inputTeacherEmail.setAttribute("required", "required");
        lblTeacherEmail.textContent = t.teacherEmail;
        inputTeacherEmail.placeholder = t.emailPlaceholder;

        if (isRegisterMode) {
          formHeading.textContent = t.teacherRegister;
          grpTeacherName.classList.remove("hidden");
          lblTeacherName.textContent = t.fullName;
          inputTeacherName.placeholder = t.teacherNamePlaceholder;

          grpSchool.classList.remove("hidden");
          inputSchool.setAttribute("required", "required");

          grpCurriculum.classList.remove("hidden");
          btnSubmit.textContent = t.registerBtn;
          btnToggleMode.textContent = t.toTeacherLog;
          btnForgot.classList.add("hidden");
        } else {
          formHeading.textContent = t.teacherLogin;
          grpTeacherName.classList.add("hidden");
          grpSchool.classList.add("hidden");
          grpCurriculum.classList.add("hidden");
          inputSchool.removeAttribute("required");

          btnSubmit.textContent = t.loginBtn;
          btnToggleMode.textContent = t.toTeacherReg;
          btnForgot.classList.remove("hidden");
        }
      }
    }

    btnLangEn.addEventListener("click", () => {
      currentLang = "en";
      btnLangEn.classList.add("active");
      btnLangTa.classList.remove("active");
      updateView();
    });

    btnLangTa.addEventListener("click", () => {
      currentLang = "ta";
      btnLangTa.classList.add("active");
      btnLangEn.classList.remove("active");
      updateView();
    });

    tabStudent.addEventListener("click", () => {
      if (activePortal !== "student") {
        activePortal = "student";
        isRegisterMode = false;
        updateView();
      }
    });

    tabTeacher.addEventListener("click", () => {
      if (activePortal !== "teacher") {
        activePortal = "teacher";
        isRegisterMode = false;
        updateView();
      }
    });

    btnToggleMode.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      updateView();
    });
          portalForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      btnSubmit.disabled = true;

      const password = inputPassword.value;
      const t = translations[currentLang];

      if (password.length < 6) {
        showStatus(t.passTooShort, "error");
        btnSubmit.disabled = false;
        return;
      }

      try {
        if (activePortal === "student") {
          const school = inputSchool.value.trim();
          const roll = inputRoll.value.trim();
          const email = getStudentEmail(school, roll);

          if (isRegisterMode) {
            const name = inputStudentName.value.trim();
            const studentClass = inputClass.value.trim();
            const sec = inputSec.value.trim();
            const board = selectBoard.value;

            if (!name || !school || !studentClass || !sec || !roll) {
              showStatus(t.fillAllFields, "error");
              btnSubmit.disabled = false;
              return;
            }

            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, "users", cred.user.uid), {
              role: "student",
              fullName: name,
              schoolName: school,
              board: board,
              className: studentClass,
              section: sec,
              rollNumber: roll,
              email: email,
              createdAt: new Date().toISOString()
            });

            showStatus(t.redirectingStudent, "success");
            setTimeout(() => { window.location.href = "student-dashboard.html"; }, 800);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
            showStatus(t.redirectingStudent, "success");
            setTimeout(() => { window.location.href = "student-dashboard.html"; }, 800);
          }
        } else {
          // Teacher Portal
          const email = inputTeacherEmail.value.trim();

          if (isRegisterMode) {
            const name = inputTeacherName.value.trim();
            const school = inputSchool.value.trim();
            const board = selectBoard.value;

            if (!name || !email || !school) {
              showStatus(t.fillAllFields, "error");
              btnSubmit.disabled = false;
              return;
            }

            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, "users", cred.user.uid), {
              role: "teacher",
              fullName: name,
              schoolName: school,
              board: board,
              email: email,
              createdAt: new Date().toISOString()
            });

            showStatus(t.redirectingTeacher, "success");
            setTimeout(() => { window.location.href = "teacher-dashboard.html"; }, 800);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
            showStatus(t.redirectingTeacher, "success");
            setTimeout(() => { window.location.href = "teacher-dashboard.html"; }, 800);
          }
        }
      } catch (err) {
        showStatus(err.message || "Authentication error", "error");
        btnSubmit.disabled = false;
      }
    });

    btnForgot.addEventListener("click", async () => {
      const t = translations[currentLang];
      if (activePortal === "teacher") {
        const email = inputTeacherEmail.value.trim();
        if (!email) {
          showStatus("Please enter your teacher email first.", "error");
          return;
        }
        try {
          await sendPasswordResetEmail(auth, email);
          showStatus(t.resetSent, "success");
        } catch (err) {
          showStatus(err.message, "error");
        }
      } else {
        showStatus("Students should contact their school teacher/admin for password reset.", "error");
      }
    });

    updateView();
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("Service Worker Registered"))
          .catch((err) => console.log("SW Registration Failed:", err));
      });
    }
  </script>
</body>
</html>
