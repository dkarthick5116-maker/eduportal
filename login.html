<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPortal - Login & Registration</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #f7f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .login-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.08);
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      position: relative;
    }

    .lang-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f4f0ff;
      border: 1px solid #ddd6fe;
      color: #6b21a8;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .logo-badge {
      width: 56px;
      height: 56px;
      background: #7c3aed;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      font-size: 28px;
    }

    .login-container h2 {
      text-align: center;
      color: #4c1d95;
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 0 0 24px 0;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      background: #fdfdfd;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: #7c3aed;
      background: #fff;
    }

    .btn-submit {
      width: 100%;
      background: #7c3aed;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: #6d28d9;
    }

    .links-area {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .links-area a {
      color: #6b21a8;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
      min-height: 18px;
    }

    .status-msg.success {
      color: #059669;
    }

    .status-msg.error {
      color: #dc2626;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <button class="lang-toggle" id="lang-btn">தமிழ்</button>

    <div class="logo-badge">📚</div>
    <h2>EduPortal</h2>
    <p class="subtitle" id="portal-sub">Sign in to your learning portal</p>

    <form id="auth-form">
      <div class="form-group">
        <label id="lbl-email" for="email">Email address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label id="lbl-pass" for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group hidden" id="confirm-pass-group">
        <label id="lbl-confirm" for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your password" />
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Login</button>
    </form>

    <div class="status-msg" id="status-msg"></div>

    <div class="links-area">
      <a id="btn-forgot" href="javascript:void(0)">Forgot password?</a>
      <a id="btn-switch-mode" href="javascript:void(0)">Create Account</a>
      <a href="index.html" id="link-home">&larr; Back to Home</a>
    </div>
  </div>

  <script type="module">
    import { registerUser, loginUser, resetPassword } from "./auth.js";

    let isRegisterMode = false;
    let currentLang = "en";

    const translations = {
      en: {
        loginSub: "Sign in to your learning portal",
        registerSub: "Create your EduPortal account",
        lblEmail: "Email address",
        placeholderEmail: "Enter your email",
        lblPass: "Password",
        placeholderPass: "Enter your password",
        lblConfirm: "Confirm password",
        placeholderConfirm: "Confirm your password",
        btnLogin: "Login",
        btnRegister: "Create Account",
        forgotPass: "Forgot password?",
        switchToRegister: "Create Account",
        switchToLogin: "Already have an account? Login",
        backHome: "← Back to Home",
        passMismatch: "Passwords do not match.",
        passTooShort: "Password must be at least 6 characters.",
        enterEmailFirst: "Please enter your email address first.",
        resetSuccess: "Password reset link sent to your email.",
        redirecting: "Redirecting to student dashboard..."
      },
      ta: {
        loginSub: "உங்கள் கணக்கில் உள்நுழையவும்",
        registerSub: "EduPortal கணக்கை உருவாக்கவும்",
        lblEmail: "மின்னஞ்சல் முகவரி",
        placeholderEmail: "மின்னஞ்சலை உள்ளிடவும்",
        lblPass: "கடவுச்சொல்",
        placeholderPass: "கடவுச்சொல்லை உள்ளிடவும்",
        lblConfirm: "கடவுச்சொல்லை உறுதிப்படுத்தவும்",
        placeholderConfirm: "கடவுச்சொல்லை மீண்டும் உள்ளிடவும்",
        btnLogin: "உள்நுழை",
        btnRegister: "கணக்கு உருவாக்கு",
        forgotPass: "கடவுச்சொல் மறந்துவிட்டதா?",
        switchToRegister: "கணக்கு உருவாக்கு",
        switchToLogin: "ஏற்கனவே கணக்கு உள்ளதா? உள்நுழை",
        backHome: "← முகப்பு பக்கத்திற்கு",
        passMismatch: "கடவுச்சொற்கள் பொருந்தவில்லை.",
        passTooShort: "கடவுச்சொல் குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.",
        enterEmailFirst: "முதலில் உங்கள் மின்னஞ்சலை உள்ளிடவும்.",
        resetSuccess: "கடவுச்சொல் மீட்டமைப்பு இணைப்பு அனுப்பப்பட்டது.",
        redirecting: "மாணவர் போர்ட்டலுக்கு செல்கிறது..."
      }
    };

    const authForm = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const confirmPassGroup = document.getElementById("confirm-pass-group");
    const btnSubmit = document.getElementById("btn-submit");
    const btnSwitchMode = document.getElementById("btn-switch-mode");
    const btnForgot = document.getElementById("btn-forgot");
    const statusMsg = document.getElementById("status-msg");
    const langBtn = document.getElementById("lang-btn");
    const portalSub = document.getElementById("portal-sub");
    const lblEmail = document.getElementById("lbl-email");
    const lblPass = document.getElementById("lbl-pass");
    const lblConfirm = document.getElementById("lbl-confirm");
    const linkHome = document.getElementById("link-home");

    function updateLanguageUI() {
      const t = translations[currentLang];
      langBtn.textContent = currentLang === "en" ? "தமிழ்" : "English";
      portalSub.textContent = isRegisterMode ? t.registerSub : t.loginSub;
      lblEmail.textContent = t.lblEmail;
      emailInput.placeholder = t.placeholderEmail;
      lblPass.textContent = t.lblPass;
      passwordInput.placeholder = t.placeholderPass;
      lblConfirm.textContent = t.lblConfirm;
      confirmPasswordInput.placeholder = t.placeholderConfirm;
      btnSubmit.textContent = isRegisterMode ? t.btnRegister : t.btnLogin;
      btnSwitchMode.textContent = isRegisterMode ? t.switchToLogin : t.switchToRegister;
      linkHome.textContent = t.backHome;
      btnForgot.textContent = t.forgotPass;
    }

    langBtn.addEventListener("click", () => {
      currentLang = currentLang === "en" ? "ta" : "en";
      updateLanguageUI();
    });

    btnSwitchMode.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";

      if (isRegisterMode) {
        confirmPassGroup.classList.remove("hidden");
        confirmPasswordInput.setAttribute("required", "required");
        btnForgot.classList.add("hidden");
      } else {
        confirmPassGroup.classList.add("hidden");
        confirmPasswordInput.removeAttribute("required");
        btnForgot.classList.remove("hidden");
      }
      updateLanguageUI();
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const t = translations[currentLang];

      if (isRegisterMode) {
        const confirmPassword = confirmPasswordInput.value;
        if (password !== confirmPassword) {
          statusMsg.textContent = t.passMismatch;
          statusMsg.className = "status-msg error";
          return;
        }
        if (password.length < 6) {
          statusMsg.textContent = t.passTooShort;
          statusMsg.className = "status-msg error";
          return;
        }

        const res = await registerUser(email, password);
        if (res.success) {
          statusMsg.textContent = t.redirecting;
          statusMsg.className = "status-msg success";
          setTimeout(() => {
            window.location.href = "student-dashboard.html";
          }, 800);
        } else {
          statusMsg.textContent = res.error;
          statusMsg.className = "status-msg error";
        }
      } else {
        const res = await loginUser(email, password);
        if (res.success) {
          statusMsg.textContent = t.redirecting;
          statusMsg.className = "status-msg success";
          setTimeout(() => {
            window.location.href = "student-dashboard.html";
          }, 800);
        } else {
          statusMsg.textContent = res.error;
          statusMsg.className = "status-msg error";
        }
      }
    });

    btnForgot.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const t = translations[currentLang];
      if (!email) {
        statusMsg.textContent = t.enterEmailFirst;
        statusMsg.className = "status-msg error";
        return;
      }
      const res = await resetPassword(email);
      if (res.success) {
        statusMsg.textContent = t.resetSuccess;
        statusMsg.className = "status-msg success";
      } else {
        statusMsg.textContent = res.error;
        statusMsg.className = "status-msg error";
      }
    });
  </script>
</body>
</html>
